<!DOCTYPE html>
    <html lang="es">
        <head>
            <title> uso de iframes</title>

            <style>
                header , footer {
                    text-align: center;
                    background-color: aquamarine;
                    color: black;
                    height: 200%;

        <body>
            <header>practicas iframe</header>
            <main>
