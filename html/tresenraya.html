<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/tresenraya.css">
    <title>Tres en raya</title>
  </head>
  <body>
    <main class="juego">
      <h1>Tres en raya</h1>

      <section class="panel">
        <p id="mensaje" class="mensaje">Turno del jugador X</p>

        <div class="tablero" aria-label="Tablero de tres en raya">
          <button class="casilla" data-posicion="0" aria-label="Casilla 1"></button>
          <button class="casilla" data-posicion="1" aria-label="Casilla 2"></button>
          <button class="casilla" data-posicion="2" aria-label="Casilla 3"></button>
          <button class="casilla" data-posicion="3" aria-label="Casilla 4"></button>
          <button class="casilla" data-posicion="4" aria-label="Casilla 5"></button>
          <button class="casilla" data-posicion="5" aria-label="Casilla 6"></button>
          <button class="casilla" data-posicion="6" aria-label="Casilla 7"></button>
          <button class="casilla" data-posicion="7" aria-label="Casilla 8"></button>
          <button class="casilla" data-posicion="8" aria-label="Casilla 9"></button>
        </div>

        <button id="reiniciar" class="reiniciar">Reiniciar partida</button>
      </section>
    </main>

    <script src="../java scrip/tresenraya.js"></script>
  </body>
</html>
