<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Acceso y registro de usuario para reserva de hotel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de hotel - Acceso o registro</title>
    <link rel="stylesheet" href="./css/UF1304-PAC1-1C-[04699240H]-[Jose Luis Angulo].css">
</head>
<body>

    <header>
        <h1>Reserva de hotel</h1>
        <p>Identifícate o crea una cuenta nueva</p>
    </header>

    <main>
        <section class="contenedor">
            <h2>Paso 4: Datos del usuario</h2>

            <section class="bloque-formulario">
                <h3>Ya soy cliente</h3>

                <!-- Formulario 4A: Identificación de usuario -->
                <form action="confirmacion.html" method="get">

                    <div class="campo">
                        <label for="usuario">Identificador de usuario</label>
                        <input type="text" id="usuario" name="usuario" required>
                    </div>

                    <div class="campo">
                        <label for="clave_acceso">Clave de acceso</label>
                        <input type="password" id="clave_acceso" name="clave_acceso" required>
                    </div>

                    <!-- Campos ocultos para simular datos anteriores -->
                    <input type="hidden" name="hotel" value="H001">
                    <input type="hidden" name="habitacion_doble" value="1">
                    <input type="hidden" name="desayuno" value="si">

                    <button type="submit">Acceder</button>
                </form>
            </section>

            <section class="bloque-formulario">
                <h3>Soy nuevo cliente</h3>

                <!-- Formulario 4B: Registro de usuario -->
                <form action="confirmacion.html" method="get">

                    <div class="campo">
                        <label for="tratamiento">Tratamiento</label>
                        <select id="tratamiento" name="tratamiento" required>
                            <option value="">Selecciona una opción</option>
                            <option value="Sr.">Sr.</option>
                            <option value="Sra.">Sra.</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>

                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos" required>
                    </div>

                    <div class="campo">
                        <label for="clave">Clave de acceso</label>
                        <input type="password" id="clave" name="clave" required>
                    </div>

                    <div class="campo">
                        <label for="repetir_clave">Repetir clave de acceso</label>
                        <input type="password" id="repetir_clave" name="repetir_clave" required>
                    </div>

                    <div class="campo">
                        <label for="nif">NIF</label>
                        <input type="text" id="nif" name="nif" placeholder="Ejemplo: 12345678A" required>
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" required>
                    </div>

                    <div class="campo">
                        <label for="direccion">Dirección del inmueble</label>
                        <input type="text" id="direccion" name="direccion" required>
                    </div>

                    <div class="campo">
                        <label for="codigo_postal">Código postal</label>
                        <input type="text" id="codigo_postal" name="codigo_postal" required>
                    </div>

                    <div class="campo">
                        <label for="poblacion">Población</label>
                        <input type="text" id="poblacion" name="poblacion" required>
                    </div>

                    <div class="campo">
                        <label for="provincia">Provincia</label>
                        <input type="text" id="provincia" name="provincia" required>
                    </div>

                    <div class="campo">
                        <label for="fecha_nacimiento">Fecha de nacimiento</label>
                        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                    </div>

                    <!-- Campos ocultos para simular datos anteriores -->
                    <input type="hidden" name="hotel" value="H001">
                    <input type="hidden" name="habitacion_doble" value="1">
                    <input type="hidden" name="desayuno" value="si">

                    <button type="submit">Registrarme</button>
                </form>
            </section>

            <p class="volver">
                <a href="hotel.html">Volver a la ficha del hotel</a>
            </p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Reserva Hotelera</p>
    </footer>

</body>
</html>
