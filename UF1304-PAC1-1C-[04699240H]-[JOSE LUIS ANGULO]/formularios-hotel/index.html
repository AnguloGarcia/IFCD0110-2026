<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Formulario de búsqueda de habitaciones de hotel">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de hotel - Búsqueda</title>
    <link rel="stylesheet" href="../css/UF1304-PAC1-1C-[04699240H]-[Jose Luis Angulo].css">
</head>
<body>

    <header>
        <h1>Reserva de hotel</h1>
        <p>Busca tu habitación para las fechas que necesitas</p>
    </header>

    <main>
        <section class="contenedor">
            <h2>Paso 1: Buscar habitación</h2>

            <form action="hoteles.html" method="get">
                
                <div class="campo">
                    <label for="lugar">Lugar o zona geográfica</label>
                    <input type="text" id="lugar" name="lugar" placeholder="Ejemplo: Barcelona" required>
                </div>

                <div class="campo">
                    <label for="entrada">Fecha de entrada</label>
                    <input type="date" id="entrada" name="entrada" required>
                </div>

                <div class="campo">
                    <label for="salida">Fecha de salida</label>
                    <input type="date" id="salida" name="salida" required>
                </div>

                <div class="campo">
                    <label for="adultos">Número de adultos</label>
                    <input type="number" id="adultos" name="adultos" min="1" max="10" value="1" required>
                </div>

                <div class="campo">
                    <label for="ninos">Número de niños</label>
                    <input type="number" id="ninos" name="ninos" min="0" max="10" value="0">
                </div>

                <div class="campo">
                    <label>Mapa de ubicación</label>
                    <iframe 
                        src="https://www.google.com/maps?q=Barcelona&output=embed"
                        title="Mapa de ubicación de Barcelona"
                        loading="lazy">
                    </iframe>
                </div>

                <button type="submit">Buscar hoteles</button>
            </form>
        </section>
    </main>

    <footer>
        <p> 2026 Reserva Hotelera
            hecho por "Jose Luis Angulo"
        </p>
    </footer>

</body>
</html>
